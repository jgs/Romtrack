<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROMtrack — rehabilitation tracking in the browser</title>
  <meta name="description" content="Counts rehab exercise repetitions, measures range of motion and flags compensations from a webcam, entirely on-device." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Cpath d='M9 21 L16 9 L23 21' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>ROMtrack</h1>
        <p class="muted" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="privacy-badge" data-i18n="privacy"></span>
      <button id="langBtn" class="ghost" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <main id="sessionView" class="layout no-print">
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="hud">
          <div class="hud-count">
            <span id="repCount">0</span><small>/<span id="repGoal">10</span></small>
            <div class="hud-sub"><span id="completeCount">0</span> <span data-i18n="complete"></span></div>
          </div>
          <div class="hud-angle"><span data-i18n="angle"></span> <strong id="angleVal">—</strong>°</div>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-target"></div>
        </div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        <div id="placeholder" class="placeholder">
          <p id="statusText" data-i18n="loading_model"></p>
        </div>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <aside class="panel">
      <h2 data-i18n="setup"></h2>
      <label class="field">
        <span data-i18n="exercise"></span>
        <select id="exerciseSel"></select>
      </label>
      <label class="field">
        <span data-i18n="side"></span>
        <select id="sideSel">
          <option value="auto" data-i18n="side_auto"></option>
          <option value="left" data-i18n="side_left"></option>
          <option value="right" data-i18n="side_right"></option>
        </select>
      </label>
      <label class="field">
        <span><span data-i18n="target"></span>: <strong id="targetVal"></strong>°</span>
        <input id="targetRange" type="range" step="1" />
      </label>
      <div class="field">
        <span><span data-i18n="rest"></span>: <strong id="restVal"></strong>°</span>
        <button id="calibrateBtn" class="secondary" type="button" data-i18n="calibrate" disabled></button>
      </div>
      <label class="field">
        <span data-i18n="reps_goal"></span>
        <input id="goalInput" type="number" min="1" max="100" value="10" />
      </label>
      <fieldset class="field">
        <legend data-i18n="source"></legend>
        <label class="radio"><input type="radio" name="source" value="camera" checked /> <span data-i18n="source_camera"></span></label>
        <label class="radio"><input type="radio" name="source" value="file" /> <span data-i18n="source_file"></span></label>
        <input id="fileInput" type="file" accept="video/*" hidden />
      </fieldset>
      <label class="radio"><input id="soundChk" type="checkbox" checked /> <span data-i18n="sound"></span></label>
      <div class="actions">
        <button id="startBtn" type="button" data-i18n="start" disabled></button>
        <button id="stopBtn" type="button" class="danger" data-i18n="stop" hidden></button>
      </div>

      <details class="history">
        <summary data-i18n="history"></summary>
        <div id="historyList"></div>
        <button id="clearHistoryBtn" type="button" class="ghost small" data-i18n="clear_history"></button>
      </details>
    </aside>
  </main>

  <section id="reportView" class="report" hidden>
    <header class="report-head">
      <div>
        <p class="eyebrow" data-i18n="report_for"></p>
        <h2 id="reportTitle"></h2>
        <p class="muted" id="reportMeta"></p>
      </div>
      <div class="report-actions no-print">
        <button id="csvBtn" type="button" class="secondary" data-i18n="csv"></button>
        <button id="jsonBtn" type="button" class="secondary" data-i18n="json"></button>
        <button id="printBtn" type="button" class="secondary" data-i18n="print"></button>
        <button id="newBtn" type="button" data-i18n="new_session"></button>
      </div>
    </header>
    <div class="cards" id="summaryCards"></div>
    <h3 data-i18n="angle_chart"></h3>
    <canvas id="chart" class="chart" width="1000" height="280"></canvas>
    <h3 data-i18n="rep_table"></h3>
    <div class="table-wrap"><table id="repTable"></table></div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </section>

  <footer class="footer no-print">
    <span>ROMtrack · MIT</span>
    <a href="https://github.com/jgs/Romtrack" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
